# Updates the Homebrew tap (irooftop/homebrew-tap) when a release is published:
# Formula/rooftop.rb (server, built from source) and Casks/irooftop.rb (desktop DMGs).
# Requires the repository secret HOMEBREW_TAP_DEPLOY_KEY: the private half of a deploy
# key with write access to irooftop/homebrew-tap (and nothing else).
name: Homebrew

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish to the tap, e.g. v0.1.0"
        required: true

permissions:
  contents: read

concurrency:
  group: homebrew-tap
  cancel-in-progress: false

jobs:
  tap:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: irooftop/homebrew-tap
          path: tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      - name: Render the formula and the cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/homebrew-tap.sh "$TAG" tap
      - name: Check Ruby syntax
        run: ruby -c tap/Formula/rooftop.rb && ruby -c tap/Casks/irooftop.rb
      - name: Push to the tap
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula Casks
          if git diff --cached --quiet; then echo "tap already up to date"; exit 0; fi
          git commit -m "rooftop ${TAG#v}"
          git push
