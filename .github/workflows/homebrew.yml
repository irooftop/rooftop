# Updates the Homebrew tap (irooftop/homebrew-tap) when a release is published, and from desktop.yml right after it publishes a tag release:
# Formula/rooftop.rb (server, built from source) and Casks/irooftop.rb (desktop DMGs).
# Needs one repository secret with write access to irooftop/homebrew-tap only:
#   HOMEBREW_TAP_TOKEN       a fine-grained token: repository irooftop/homebrew-tap, Contents: read and write
#   HOMEBREW_TAP_DEPLOY_KEY  or the private half of a write deploy key (if the organization allows deploy keys)
# Without either, the run skips the push with a notice.
name: Homebrew

on:
  release:
    types: [published]
  # Called by desktop.yml once it has published the release (a release published with GITHUB_TOKEN
  # does not fire the `release` event above, so the tag-push pipeline calls this directly).
  workflow_call:
    inputs:
      tag:
        description: "Release tag to publish to the tap, e.g. v0.1.0"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish to the tap, e.g. v0.1.0"
        required: true

permissions:
  contents: read

concurrency:
  group: homebrew-tap
  cancel-in-progress: false

jobs:
  tap:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      HAS_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
      HAS_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY != '' }}
    steps:
      - name: Check credentials for the tap
        id: creds
        run: |
          if [ "$HAS_TOKEN" = true ] || [ "$HAS_KEY" = true ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::No HOMEBREW_TAP_TOKEN or HOMEBREW_TAP_DEPLOY_KEY secret: the tap was not updated"; echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v7
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/checkout@v7
        if: steps.creds.outputs.ok == 'true'
        with:
          repository: irooftop/homebrew-tap
          path: tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN || github.token }}
          ssh-key: ${{ secrets.HOMEBREW_TAP_TOKEN == '' && secrets.HOMEBREW_TAP_DEPLOY_KEY || '' }}
      - name: Render the formula and the cask
        if: steps.creds.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/homebrew-tap.sh "$TAG" tap
      - name: Check Ruby syntax
        if: steps.creds.outputs.ok == 'true'
        run: ruby -c tap/Formula/rooftop.rb && ruby -c tap/Casks/irooftop.rb
      - name: Push to the tap
        if: steps.creds.outputs.ok == 'true'
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula Casks
          if git diff --cached --quiet; then echo "tap already up to date"; exit 0; fi
          git commit -m "rooftop ${TAG#v}"
          git push
