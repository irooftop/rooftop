[package]
name = "rooftop"
version = "0.5.9"
edition = "2024"
rust-version = "1.88"
description = "iRoof.top: continue a Telegram or WhatsApp chat with an LLM that writes in the style of a person from the export (OpenAI-compatible, MCP)"
license = "MIT"
readme = "README.md"
homepage = "https://iroof.top"
documentation = "https://irooftop.github.io/rooftop"
repository = "https://github.com/irooftop/rooftop"
keywords = ["telegram", "whatsapp", "llm", "mcp", "chat"]
categories = ["command-line-utilities", "web-programming::http-server"]
include = ["src/**/*", "web/**/*", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
anyhow = "1.0.104"
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
axum = { version = "0.8.9", features = ["multipart", "ws"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15.7"
futures = "0.3.34"
getrandom = "0.4.3"
hex = "0.4.3"
if-addrs = "0.15.0"
mime_guess = "2.0.5"
percent-encoding = "2.3.2"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider", "stream", "http2"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "trace", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v4"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# PIN hashing is deliberately expensive, so keep debug builds and tests fast.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
