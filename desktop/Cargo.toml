[package]
name = "rooftop-desktop"
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
description = "iRoof.top desktop app (Tauri 3 shell around the embedded rooftop server)"
license = "MIT"
publish = false

# Self-contained: NOT a member of the root `rooftop` crate's workspace.
[workspace]

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.4", features = [] }

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
rooftop = { path = ".." }
tauri = { version = "3.0.0-alpha.5", features = [] }
tauri-runtime-wry = "3.0.0-alpha.5"
tokio = { version = "1.54.1", features = ["full"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
